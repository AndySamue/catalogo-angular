<h2>Gestión de productos</h2>

<form (ngSubmit)="guardar()">
  <label>Nombre</label>
  <input name="nombre" [(ngModel)]="form().nombre" required />

  <label>Descripción</label>
  <input name="descripcion" [(ngModel)]="form().descripcion" />

  <label>Precio</label>
  <input name="precio" type="number" [(ngModel)]="form().precio" required />

  <label>Stock</label>
  <input name="stock" type="number" [(ngModel)]="form().stock" required />

  <button type="submit">{{ form().id ? 'Actualizar' : 'Crear' }}</button>
</form>

<table>
  <tr>
    <th>Nombre</th>
    <th>Descripción</th>
    <th>Precio</th>
    <th>Stock</th>
    <th>Acciones</th>
  </tr>
  @for (p of productos(); track p.id) {
    <tr>
      <td>{{ p.nombre }}</td>
      <td>{{ p.descripcion }}</td>
      <td>$ {{ p.precio }}</td>
      <td>{{ p.stock }}</td>
      <td>
        <button (click)="editar(p)">Editar</button>
        <button (click)="eliminar(p.id!)">Eliminar</button>
      </td>
    </tr>
  }
</table>
